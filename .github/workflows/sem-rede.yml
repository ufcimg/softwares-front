# Garante que index.html (+ dados.js, app.js, estilos.css)
# continua 100% offline — não é conveniência, é a fronteira de privacidade:
# este formulário digita CPF/endereço de autores, então "roda só no
# navegador" precisa ser verificável, não só prometido no texto da página.
#
# Dois checks:
#   1. Em nenhum dos quatro arquivos (com o bloco vendorizado removido de
#      index.html primeiro), nenhuma referência que carregue ou envie algo para
#      fora. Um link comum de citação, <a href="https://..." rel="noopener
#      noreferrer">, é permitido: só leva a pessoa a outro lugar quando ela clica.
#      A regra mora em .github/scripts/verificar-sem-rede.py (a mesma que a suíte
#      local usa, com testes em testes/sem_rede.py).
#   2. Dentro do bloco vendorizado, o conteúdo não muda sem que alguém
#      atualize o hash de referência no mesmo commit — ninguém revisa 500KB
#      de código minificado linha a linha num diff, então uma alteração
#      silenciosa ali passaria batida sem essa trava.

name: Verificar isolamento de rede

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sem-rede:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sem referência de rede fora do bloco vendorizado
        run: python3 .github/scripts/verificar-sem-rede.py .

      - name: Hash do bloco vendorizado confere
        run: |
          set -euo pipefail
          sed -n '/BEGIN VENDOR/,/END VENDOR/p' index.html \
            | sha256sum | awk '{print $1"  index.html.vendor-block"}' > /tmp/hash-atual.sha256
          if ! diff -u .github/vendor-pdf-lib.sha256 /tmp/hash-atual.sha256; then
            echo "" >&2
            echo "O bloco vendorizado mudou. Se foi intencional (ex.: atualizar o pdf-lib)," >&2
            echo "recalcule e substitua .github/vendor-pdf-lib.sha256 no MESMO commit." >&2
            exit 1
          fi
          echo "Hash do bloco vendorizado confere."
